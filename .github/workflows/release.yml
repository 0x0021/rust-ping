name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 cross linker (Linux ARM only)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          BIN="rust-ping-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$BIN"
          cp "target/${{ matrix.target }}/release/rust-ping" "dist/$BIN/"
          cp README.md config.example.toml "dist/$BIN/"
          tar -czf "${BIN}.tar.gz" -C dist "$BIN"
          shasum -a 256 "${BIN}.tar.gz" > "${BIN}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bin = "rust-ping-$env:VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Path "dist/$bin" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rust-ping.exe" "dist/$bin/"
          Copy-Item README.md, config.example.toml "dist/$bin/"
          Compress-Archive -Path "dist/$bin" -DestinationPath "$bin.zip"
          (Get-FileHash "$bin.zip" -Algorithm SHA256).Hash.ToLower() + "  $bin.zip" | Out-File "$bin.zip.sha256" -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
          if-no-files-found: error

  package-linux:
    name: Package Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rpm_arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            rpm_arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: pkg-linux-${{ matrix.arch }}

      - name: Install packaging tools
        env:
          RUSTFLAGS: ""
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build deb and rpm
        shell: bash
        run: |
          DEB="rust-ping-${VERSION}-${{ matrix.arch }}.deb"
          RPM="rust-ping-${VERSION}-${{ matrix.rpm_arch }}.rpm"
          cargo deb --no-build --output "$DEB"
          cargo generate-rpm --output "$RPM"
          sha256sum "$DEB" > "$DEB.sha256"
          sha256sum "$RPM" > "$RPM.sha256"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-${{ matrix.arch }}
          path: |
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256
          if-no-files-found: error

  package-macos:
    name: Package macOS (universal pkg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: pkg-macos

      - name: Build both architectures
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Create universal binary
        shell: bash
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/rust-ping \
            target/aarch64-apple-darwin/release/rust-ping \
            -output rust-ping-universal

      - name: Create universal pkg
        shell: bash
        run: |
          PKG="rust-ping-${VERSION}-universal-apple-darwin.pkg"
          packaging/macos/build-pkg.sh "$VERSION" rust-ping-universal "$PKG"
          shasum -a 256 "$PKG" > "$PKG.sha256"

      - name: Create app bundle for app stores (with Bundle ID)
        shell: bash
        run: |
          APP_ZIP="rust-ping-${VERSION}-universal-apple-darwin.app.zip"
          packaging/macos/build-app.sh "$VERSION" rust-ping-universal rust-ping.app "$APP_ZIP"
          shasum -a 256 "$APP_ZIP" > "$APP_ZIP.sha256"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-macos
          path: |
            *.pkg
            *.pkg.sha256
            *.app.zip
            *.app.zip.sha256
          if-no-files-found: error

  package-windows:
    name: Package Windows (msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: pkg-windows-msi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install WiX v5
        shell: pwsh
        run: dotnet tool install --global wix --version 5.*

      - name: Build MSI
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $numeric = $env:VERSION.TrimStart('v')
          $msi = "rust-ping-$env:VERSION-x86_64-pc-windows-msvc.msi"
          wix build -arch x64 -d "Version=$numeric" "packaging/windows/rust-ping.wxs" -out "$msi"
          (Get-FileHash "$msi" -Algorithm SHA256).Hash.ToLower() + "  $msi" | Out-File "$msi.sha256" -Encoding utf8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pkg-windows
          path: |
            *.msi
            *.msi.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, package-linux, package-macos, package-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' -o -name '*.deb' -o -name '*.rpm' -o -name '*.msi' -o -name '*.pkg' \) -exec cp {} release/ \;
          ls -lh release/

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: rust-ping ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: release/*
